<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkBuddy 编程闯关教程 · 实践区</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="practice" class="theme-warm">
<div class="grid-bg" aria-hidden="true"></div>
<div class="glow a" aria-hidden="true"></div>
<div class="glow b" aria-hidden="true"></div>

<div class="wrap">
<header class="topbar">
  <div class="tb-left">
    <span class="logo-dot"></span>
    <span class="tb-title" id="crumbText">WORKBUDDY · PRACTICE ZONE</span>
  </div>
  <div class="tb-right">
    <a class="pill" href="index.html">首页</a>
    <a class="pill" href="tutorial.html">教程</a>
    <span class="tb-stat" id="topProgress">PRACTICE 0%</span>
    <button class="pill" id="gridToggle">GRID: ON</button>
  </div>
</header>

<div class="tut-body">
  <!-- ========== 侧边栏 ========== -->
  <aside class="sidebar">
    <div class="sb-head">
      <div class="sb-kicker">PRACTICE MAP</div>
      <div class="sb-sub" id="sbMeta">5 个阶段 · 8 章 · 约 70 分钟</div>
    </div>

    <div class="sb-progress">
      <div class="txt"><span id="progText">已完成 0 / 8 章</span></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>

    <div class="sb-search">
      <input id="searchInput" type="text" placeholder="搜索步骤 / 关键词">
    </div>

    <ul class="toc" id="toc"></ul>

    <div class="sb-foot">
      项目：用 WorkBuddy 做一只随机走动的像素猫。<br>点步骤切换正文，完成进度保存在本机浏览器。
    </div>
  </aside>

  <!-- ========== 正文 ========== -->
  <main class="main" id="chapterView"></main>
</div>
</div>

<script src="assets/js/practice.js"></script>
<script src="assets/js/practice-app.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
